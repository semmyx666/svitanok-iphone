services:
  proxy:
    build: .
    restart: unless-stopped
    environment:
      ALERTS_TOKEN: ${ALERTS_TOKEN:?Set ALERTS_TOKEN in .env}
    expose:
      - "8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      ALERTS_DOMAIN: ${ALERTS_DOMAIN:?Set ALERTS_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
