name: Svitanok
options:
  bundleIdPrefix: ua.semmyx
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Svitanok:
    type: application
    platform: iOS
    sources:
      - path: ios/Svitanok
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ua.semmyx.svitanok
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ios/Svitanok/Info.plist
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "4"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SvitanokTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ios/SvitanokTests
    dependencies:
      - target: Svitanok
  SvitanokUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ios/SvitanokUITests
    dependencies:
      - target: Svitanok
schemes:
  Svitanok:
    build:
      targets:
        Svitanok: all
    test:
      targets:
        - SvitanokTests
        - SvitanokUITests
