name: Svitanok
options:
  bundleIdPrefix: ua.semmyx
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Svitanok:
    type: application
    platform: iOS
    sources:
      - path: ios/Svitanok
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ua.semmyx.svitanok
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSAlarmKitUsageDescription: "Світанок устанавливает выбранный вами будильник и резервный сигнал."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Світанок"
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SvitanokTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ios/SvitanokTests
    dependencies:
      - target: Svitanok
schemes:
  Svitanok:
    build:
      targets:
        Svitanok: all
    test:
      targets:
        - SvitanokTests
